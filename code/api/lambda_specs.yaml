openapi: 3.1.0
info:
  title: OCG Statistics Lambda Function APIs
  version: 1.0.0
  description: |
    # 遊戯王カード統計基盤 AWS Lambda API 仕様書

    本仕様書は、`ocg_statistics` プロジェクトにおいて外部データ収集（Neuron / YGOPRODeck API）、PostgreSQL (Neon) へのマスターデータ登録、およびカード画像ストレージ (AWS S3) 同期を担う AWS Lambda 関数群の **引数仕様（Request Body）、レスポンス仕様（Response Body）、バリデーション制約、およびエラー挙動** を定義する単一の真実（Single Source of Truth）です。

    ---

    ## 1. システムアーキテクチャと実行モデル

    | 関数名 | エントリポイント | ローカルポート (RIE) | タイムアウト / メモリ | 責務概要 |
    | :--- | :--- | :---: | :---: | :--- |
    | **`cardIdCheck`** | `cmd/aws_lambda/cardIdCheck/main.go` | `9001` | 240秒 / 1024MB | 公式 Neuron DB をスクレイピングし、カード ID の実在判定を行う |
    | **`cardInfoInsert`** | `cmd/aws_lambda/cardInfoInsert/main.go` | `9002` | 240秒 / 1024MB | 外部 API からカード詳細情報を収集し、Neon DB へ並行挿入する |
    | **`syncStorageImageWithDB`** | `cmd/aws_lambda/syncStorageImageWithDB/main.go` | `9003` | 300秒 / 1024MB | 外部 CDN の画像を S3 にストリーム同期し、DB の配信 URL を更新する |

    ### 1.1 AWS Lambda 呼び出しプロトコルとエラー伝播
    1. **正常完了 (`200 OK`)**: ハンドラー戻り値の JSON ペイロードを返却。
    2. **関数エラー (`X-Amz-Function-Error: Unhandled`)**: HTTP ステータス 200 だがレスポンスヘッダーで関数エラーを通知。ペイロードは `LambdaFunctionError`。
    3. **部分失敗の許容設計 (Partial Failure Pattern)**: バッチ処理関数では、個別カードの失敗で Lambda 全体を落とさず、正常レスポンス内のリスト（`failedIds` や `errors`）に収集して 200 OK で返却。

    ### 1.2 トランザクション境界原則
    外部 HTTP 通信や S3 アップロード（外部 I/O）は DB トランザクション外で実行し、I/O 完了後にのみ `ExecTx` で DB 更新を実施します。

servers:
  - url: http://localhost:9001
    description: ローカル検証環境 - cardIdCheck RIE エンドポイント
  - url: http://localhost:9002
    description: ローカル検証環境 - cardInfoInsert RIE エンドポイント
  - url: http://localhost:9003
    description: ローカル検証環境 - syncStorageImageWithDB RIE エンドポイント
  - url: https://lambda.ap-northeast-1.amazonaws.com
    description: AWS 本番 / 開発環境 (Lambda Invoke API)

paths:
  # =================================================================
  # 1. cardIdCheck (カード実在性チェック)
  # =================================================================
  /2015-03-31/functions/cardIdCheck/invocations:
    post:
      summary: カードID存在確認 (cardIdCheck)
      operationId: checkCardId
      description: |
        公式データベース（Neuron DB: `www.db.yugioh-card.com`）のカード検索ページをスクレイピングし、指定されたカード ID (cid) が実在するかどうかを判定します。
      requestBody:
        description: |
          cardIdCheck 関数の入力 JSON ペイロード仕様。
          Neuron DB の検索 URL (`https://www.db.yugioh-card.com/yugiohdb/card_search.action?ope=2&cid={id}&request_locale=ja`) に渡すカード ID を指定します。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  pattern: '^[0-9]+$'
                  minLength: 1
                  description: |
                    チェック対象の遊戯王カード CID（Neuron Card ID）。
                    - 型: 文字列 (`string`)
                    - 必須: 必須 (`required: true`)
                    - 制約: 1文字以上の半角数字文字列 (`^[0-9]+$`)
                    - バリデーション:
                      - 不正な JSON 形式や型不一致時は `*json.SyntaxError` / `*json.UnmarshalTypeError` の Lambda 関数エラー
                      - 存在しないカード ID（例: "99999999"）が指定された場合は、エラーにならず `exists: false` を返却
                  example: "10000"
            examples:
              normalCheck:
                summary: 正常系（実在するカード ID）
                description: 実在するカード ID "10000" を指定
                value:
                  id: "10000"
              nonExistentCheck:
                summary: 存在しないカード ID
                description: 未存在のカード ID "99999999" を指定（exists=false で返却される）
                value:
                  id: "99999999"
      responses:
        '200':
          description: |
            判定成功レスポンス。
            カードが存在する場合は `exists: true`、存在しない場合は `exists: false` を返却します。
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - exists
                properties:
                  id:
                    type: string
                    description: リクエストされたカード ID（エコーバック）。
                    example: "10000"
                  exists:
                    type: boolean
                    description: 公式 Neuron DB にカードが存在する場合は true、未存在の場合は false。
                    example: true
              examples:
                cardExists:
                  summary: カードが存在する場合
                  value:
                    id: "10000"
                    exists: true
                cardNotExists:
                  summary: カードが存在しない場合
                  value:
                    id: "99999999"
                    exists: false
        '400':
          description: |
            リクエスト JSON のアンマーシャル失敗時（Lambda Function Error: Unhandled）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LambdaFunctionError'
              example:
                errorMessage: "invalid character '}' looking for beginning of object key string"
                errorType: "*json.SyntaxError"

  # =================================================================
  # 2. cardInfoInsert (カード詳細収集・DB挿入バッチ)
  # =================================================================
  /2015-03-31/functions/cardInfoInsert/invocations:
    post:
      summary: カード詳細情報収集・DB 登録バッチ (cardInfoInsert)
      operationId: insertCardInfo
      description: |
        Neuron DB スクレイピングおよび YGOPRODeck API 連携を行い、カード基本レコード、モンスター/魔法/罠詳細、属性・種族マスタ、画像 URL メタデータを Neon DB（PostgreSQL）へ一括挿入します。
      requestBody:
        description: |
          cardInfoInsert 関数の入力 JSON ペイロード仕様。
          バッチ処理の開始カード ID (`startId`) と、そこから連続して処理する件数 (`delta`) を指定します。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startId
                - delta
              properties:
                startId:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    バッチ収集を開始する起点のカード ID（Neuron CID / YGOPRODeck ID）。
                    - 型: 64bit 整数 (`integer`, `int64`)
                    - 必須: 必須 (`required: true`)
                    - 制約: 0 以上の整数 (`minimum: 0`)
                    - 用途: 処理対象範囲の開始インデックス `startId`
                  example: 10000
                delta:
                  type: integer
                  format: int64
                  minimum: 1
                  description: |
                    startId から連続して取得・挿入を試行するカード件数。
                    - 型: 64bit 整数 (`integer`, `int64`)
                    - 必須: 必須 (`required: true`)
                    - 制約: 1 以上の整数 (`minimum: 1`)
                    - 処理範囲: `[startId, startId + delta)`
                    - バリデーションルール:
                      - `delta <= 0` の場合はハンドラー冒頭でバリデーションエラー (`delta must be > 0`) が発生し、Lambda 関数エラー（Function Error）として即座に中断されます。
                  example: 10
            examples:
              batchNormal:
                summary: 標準バッチリクエスト (10件処理)
                description: ID 10000 から 10 件（10000 〜 10009）を並行バッチ処理
                value:
                  startId: 10000
                  delta: 10
              batchSingle:
                summary: 単一カード処理 (1件)
                description: 特定の 1 枚のみを取得・挿入
                value:
                  startId: 89631139
                  delta: 1
      responses:
        '200':
          description: |
            バッチ実行完了。
            部分失敗を許容する設計となっており、一部のカードで取得・挿入エラーが発生しても 200 OK で返却され、
            失敗したカード ID が `failedIds` に収集されます。全件成功時は空配列 `[]` です。
          content:
            application/json:
              schema:
                type: object
                required:
                  - failedIds
                properties:
                  failedIds:
                    type: array
                    description: |
                      スクレイピング失敗、カード未存在（404）、外部 API レート制限、または DB 挿入失敗となったカード ID の配列。
                      全件成功時は空配列 `[]`。
                    items:
                      type: integer
                      format: int64
                      description: 失敗したカード ID
                    example: [10003, 10007]
              examples:
                allSuccess:
                  summary: 全件挿入成功
                  value:
                    failedIds: []
                partialFailure:
                  summary: 一部のカードで取得/挿入失敗（部分失敗）
                  value:
                    failedIds: [10003, 10007]
        '400':
          description: |
            バリデーションエラー (`delta <= 0`) または JSON パース失敗時（Lambda Function Error: Unhandled）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LambdaFunctionError'
              examples:
                validationErrorDelta:
                  summary: delta <= 0 バリデーションエラー
                  value:
                    errorMessage: "delta must be > 0"
                    errorType: "*errors.errorString"
                invalidJson:
                  summary: JSON パースエラー
                  value:
                    errorMessage: "json: cannot unmarshal string into Go struct field Input.delta of type int64"
                    errorType: "*json.UnmarshalTypeError"

  # =================================================================
  # 3. syncStorageImageWithDB (画像 S3 ストリーム同期バッチ)
  # =================================================================
  /2015-03-31/functions/syncStorageImageWithDB/invocations:
    post:
      summary: カード画像 S3 ストリーム同期・DB 更新バッチ (syncStorageImageWithDB)
      operationId: syncStorageImages
      description: |
        DB（`card_images` テーブル）内の外部画像 URL（`image_url_*_api`）に基づき、画像実体バイナリを外部 CDN から S3（またはローカル MinIO）へストリーミング転送し、アプリ用配信 URL（`image_url_*_this_app`）を DB に書き戻します。
      requestBody:
        description: |
          syncStorageImageWithDB 関数の入力 JSON ペイロード仕様。
          S3 への画像ストリーム転送および DB 更新を行う対象の親カード OCG ID リスト (`ocgCardIds`) を指定します。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ocgCardIds
              properties:
                ocgCardIds:
                  type: array
                  minItems: 1
                  description: |
                    画像同期対象とする親カードの OCG ID (`ocg_api_id`) の配列。
                    - 型: 64bit 整数の配列 (`array[integer(int64)]`)
                    - 必須: 必須 (`required: true`)
                    - 制約: 要素数 1 以上の配列 (`minItems: 1`)、各要素 `> 0`
                    - バリデーションルール:
                      - 配列が空（`len(ocgCardIds) == 0`）または未指定（`null`）の場合、ハンドラー冒頭でバリデーションエラー (`ocgCardIds must not be empty`) が発生し、Lambda 関数エラー（Function Error）として即座に中断されます。
                      - JSON のアンマーシャル失敗時は `failed to unmarshal request event: ...` を返却します。
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    description: 同期対象親カードの OCG ID (`ocg_api_id`)
                  example: [89631139, 46986414]
            examples:
              multiCards:
                summary: 複数カード指定 (標準同期)
                description: カード ID 89631139 と 46986414 の画像を同期
                value:
                  ocgCardIds: [89631139, 46986414]
              singleCard:
                summary: 単一カード指定
                description: カード ID 89631139 のみ同期
                value:
                  ocgCardIds: [89631139]
      responses:
        '200':
          description: |
            同期完了レスポンス。
            処理対象数、成功カード ID、失敗カード ID、同期画像数、スキップ画像数、および詳細エラー情報を返却します。
          content:
            application/json:
              schema:
                type: object
                required:
                  - totalProcessedCards
                  - successfulOcgCardIds
                  - failedOcgCardIds
                  - syncedImageCount
                  - skippedImageCount
                  - errors
                properties:
                  totalProcessedCards:
                    type: integer
                    minimum: 0
                    description: リクエストされた対象カードの総件数 (`len(ocgCardIds)`)。
                    example: 2
                  successfulOcgCardIds:
                    type: array
                    description: 全バリエーション（Small/Large/Cropped）の画像同期または検証が完全に成功したカード ID の配列。
                    items:
                      type: integer
                      format: int64
                    example: [89631139]
                  failedOcgCardIds:
                    type: array
                    description: 画像同期、S3 ストリーム転送、または DB 更新のいずれかで失敗したカード ID の配列。
                    items:
                      type: integer
                      format: int64
                    example: [46986414]
                  syncedImageCount:
                    type: integer
                    minimum: 0
                    description: 外部 CDN からダウンロードし、S3 に新規アップロードおよび DB 更新が完了した画像バリエーションの総数。
                    example: 3
                  skippedImageCount:
                    type: integer
                    minimum: 0
                    description: 既に S3 上に画像実体が存在し、かつ DB の配信 URL も設定済みであったため同期をスキップした画像数。
                    example: 0
                  errors:
                    type: array
                    description: 個別カード・画像単位で発生したエラー詳細情報のリスト。全件成功時は空配列 `[]`。
                    items:
                      $ref: '#/components/schemas/SyncError'
              examples:
                completeSuccess:
                  summary: 全件同期成功
                  value:
                    totalProcessedCards: 1
                    successfulOcgCardIds: [89631139]
                    failedOcgCardIds: []
                    syncedImageCount: 3
                    skippedImageCount: 0
                    errors: []
                partialFailureWithErrors:
                  summary: 一部カードでストリーム取得または S3 転送失敗
                  value:
                    totalProcessedCards: 2
                    successfulOcgCardIds: [89631139]
                    failedOcgCardIds: [46986414]
                    syncedImageCount: 3
                    skippedImageCount: 0
                    errors:
                      - ocgCardId: 46986414
                        ocgApiImageId: 46986414
                        message: "failed to stream image to S3: connection timeout"
        '400':
          description: |
            バリデーションエラー (`ocgCardIds` が空) または JSON パース失敗時（Lambda Function Error: Unhandled）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LambdaFunctionError'
              examples:
                emptyOcgCardIds:
                  summary: ocgCardIds 空配列バリデーションエラー
                  value:
                    errorMessage: "ocgCardIds must not be empty"
                    errorType: "*errors.errorString"
                invalidJson:
                  summary: JSON パースエラー
                  value:
                    errorMessage: "failed to unmarshal request event: invalid character 'a' looking for beginning of value"
                    errorType: "*errors.errorString"

# ===================================================================
# コンポーネント & スキーマ詳細定義 (Components & Schemas)
# ===================================================================
components:
  schemas:
    # -------------------------------------------------------------
    # 1. cardIdCheck スキーマ定義
    # -------------------------------------------------------------
    CardIdCheckInput:
      type: object
      required:
        - id
      description: cardIdCheck 関数の入力イベントペイロード
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          minLength: 1
          description: チェック対象の遊戯王カード CID（Neuron Card ID）。数字のみで構成される文字列。
          example: "10000"

    CardIdCheckOutput:
      type: object
      required:
        - id
        - exists
      description: cardIdCheck 関数の判定結果ペイロード
      properties:
        id:
          type: string
          description: リクエストされたカード ID（エコーバック）。
          example: "10000"
        exists:
          type: boolean
          description: 公式 Neuron DB に該当カードが存在する場合は true、未存在の場合は false。
          example: true

    # -------------------------------------------------------------
    # 2. cardInfoInsert スキーマ定義
    # -------------------------------------------------------------
    CardInfoInsertInput:
      type: object
      required:
        - startId
        - delta
      description: cardInfoInsert 関数の入力イベントペイロード
      properties:
        startId:
          type: integer
          format: int64
          minimum: 0
          description: バッチ挿入を開始する起点カード ID（Neuron CID / YGOPRODeck ID）。0 以上の整数。
          example: 10000
        delta:
          type: integer
          format: int64
          minimum: 1
          description: |
            起点 startId から連続して取得・挿入を試行するカード件数。
            1 以上の整数が必須（delta <= 0 はバリデーションエラー）。
          example: 10

    CardInfoInsertOutput:
      type: object
      required:
        - failedIds
      description: cardInfoInsert 関数の出力イベントペイロード（部分失敗許容モデル）
      properties:
        failedIds:
          type: array
          description: スクレイピング失敗、未存在（404）、外部 API レート制限、または DB 挿入失敗となったカード ID の配列。全件成功時は空配列 `[]`。
          items:
            type: integer
            format: int64
            description: 失敗したカード ID
          example: [10002, 10005]

    # -------------------------------------------------------------
    # 3. syncStorageImageWithDB スキーマ定義
    # -------------------------------------------------------------
    SyncImagesInput:
      type: object
      required:
        - ocgCardIds
      description: syncStorageImageWithDB 関数の入力イベントペイロード
      properties:
        ocgCardIds:
          type: array
          minItems: 1
          description: 画像同期対象とする親カードの OCG ID (`ocg_api_id`) リスト。要素数 1 以上の配列が必須。
          items:
            type: integer
            format: int64
            minimum: 1
            description: 対象親カードの OCG ID
          example: [89631139, 46986414]

    SyncError:
      type: object
      required:
        - ocgCardId
        - ocgApiImageId
        - message
      description: 画像同期中に発生した個別カード・個別画像単位のエラー詳細レコード
      properties:
        ocgCardId:
          type: integer
          format: int64
          description: エラーが発生した対象カードの OCG ID (`ocg_api_id`)。
          example: 46986414
        ocgApiImageId:
          type: integer
          format: int64
          description: エラーが発生した対象画像の ID (`ocg_api_image_id`)。カードレコード未存在時は 0。
          example: 46986414
        message:
          type: string
          description: 発生したエラーの根本原因メッセージ。
          example: "failed to stream image to S3: connection timeout"

    SyncImagesOutput:
      type: object
      required:
        - totalProcessedCards
        - successfulOcgCardIds
        - failedOcgCardIds
        - syncedImageCount
        - skippedImageCount
        - errors
      description: syncStorageImageWithDB 関数の実行結果サマリーペイロード
      properties:
        totalProcessedCards:
          type: integer
          minimum: 0
          description: リクエストで渡され処理対象となった親カードの総件数（`len(ocgCardIds)`）。
          example: 2
        successfulOcgCardIds:
          type: array
          description: 全ての画像バリエーション（Small/Large/Cropped）の同期または検証が完全に成功したカード ID の配列。
          items:
            type: integer
            format: int64
          example: [89631139]
        failedOcgCardIds:
          type: array
          description: 画像同期、S3 ストリーム転送、または DB 更新のいずれかで失敗したカード ID の配列。
          items:
            type: integer
            format: int64
          example: [46986414]
        syncedImageCount:
          type: integer
          minimum: 0
          description: 外部 CDN からダウンロードし、S3 に新規アップロードおよび DB 更新が完了した画像バリエーションの総数。
          example: 3
        skippedImageCount:
          type: integer
          minimum: 0
          description: 既に S3 上に画像実体が存在し、かつ DB の配信 URL も設定済みであったため同期をスキップした画像数。
          example: 0
        errors:
          type: array
          description: 個別カード・画像単位で発生したエラー詳細情報のリスト。全件成功時は空配列 `[]`。
          items:
            $ref: '#/components/schemas/SyncError'

    # -------------------------------------------------------------
    # 4. AWS Lambda 共通エラー (Function Error) スキーマ定義
    # -------------------------------------------------------------
    LambdaFunctionError:
      type: object
      required:
        - errorMessage
        - errorType
      description: |
        AWS Lambda ランタイムまたはハンドラーが返却する未処理関数エラー (Unhandled Function Error)。
        HTTP ステータスコードは 200 OK ですが、レスポンスヘッダーに `X-Amz-Function-Error: Unhandled` が付与されます。
      properties:
        errorMessage:
          type: string
          description: ランタイムまたはハンドラーから返却されたエラーメッセージ文字列。
          example: "delta must be > 0"
        errorType:
          type: string
          description: Go 言語のエラー型情報。
          example: "*errors.errorString"
        stackTrace:
          type: array
          description: スタックトレース情報（パニック発生時等に提供される配列）。
          items:
            type: string
