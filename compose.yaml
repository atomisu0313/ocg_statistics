services:
  cardapicall_idcheck:
    build:
      context: ./code/cardApiCall
      dockerfile: ./cmd/aws_lambda/cardIdCheck/Dockerfile
    container_name: ocg_cardapicall_idcheck
    ports:
      - "9001:8080"
    entrypoint: /usr/local/bin/aws-lambda-rie
    command: ./main
    restart: unless-stopped
    networks:
      - ocg-network
  cardapicall_infoinsert:
    build:
      context: ./code/cardApiCall
      dockerfile: ./cmd/aws_lambda/cardInfoInsert/Dockerfile
    container_name: ocg_cardapicall_infoinsert
    ports:
      - "9002:8080"
    environment:
      PG_DB_USER: postgres
      PG_DB_PASSWORD: postgres
      PG_DB_HOST_PORT: ocg_db_local:5432
      PG_DB_NAME: postgres
    entrypoint: /usr/local/bin/aws-lambda-rie
    command: ./main
    restart: unless-stopped
    networks:
      - ocg-network
  cardapicall_syncstorageimage:
    build:
      context: ./code/cardApiCall
      dockerfile: ./cmd/aws_lambda/syncStorageImageWithDB/Dockerfile
    container_name: ocg_cardapicall_syncstorageimage
    ports:
      - "9003:8080"
    environment:
      PG_DB_USER: postgres
      PG_DB_PASSWORD: postgres
      PG_DB_HOST_PORT: ocg_db_local:5432
      PG_DB_NAME: postgres
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_USE_PATH_STYLE: "true"
      CARD_IMAGE_BUCKET_NAME: ocg-card-images
      CARD_IMAGE_CDN_BASE_URL: http://localhost:9000/ocg-card-images
    depends_on:
      minio:
        condition: service_started
      minio_create_buckets:
        condition: service_completed_successfully
      ocg_db_local:
        condition: service_started
    entrypoint: /usr/local/bin/aws-lambda-rie
    command: ./main
    restart: unless-stopped
    networks:
      - ocg-network
  minio:
    image: minio/minio:latest
    container_name: ocg_minio_local
    ports:
      - "9000:9000"
      - "9004:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_volume_ocg:/data
    restart: unless-stopped
    networks:
      - ocg-network
  minio_create_buckets:
    image: minio/mc:latest
    container_name: ocg_minio_create_buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin); do
        echo '...waiting for minio to be ready...'
        sleep 1
      done;
      /usr/bin/mc mb --ignore-existing myminio/ocg-card-images;
      /usr/bin/mc anonymous set download myminio/ocg-card-images;
      echo 'Bucket ocg-card-images created successfully';
      exit 0;
      "
    networks:
      - ocg-network
  ocg_db_local:
    image: postgres:16.7-bookworm
    container_name: 'ocg-db-local'
    ports:
      - '5555:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./database/localsetup:/docker-entrypoint-initdb.d
      - postgres_volume_ocg:/var/lib/postgresql/data
    command: -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    networks:
      - ocg-network
volumes:
  postgres_volume_ocg:
  minio_volume_ocg:

networks:
  ocg-network:
    driver: bridge