services:
  cardapicall_idcheck:
    build:
      context: ./code/cardApiCall
      dockerfile: ./cmd/aws_lambda/cardIdCheck/Dockerfile
    container_name: ocg_cardapicall_idcheck
    ports:
      - "9001:8080"
    entrypoint: /usr/local/bin/aws-lambda-rie
    command: ./main
    restart: unless-stopped
    networks:
      - ocg-network
  cardapicall_infoinsert:
    build:
      context: ./code/cardApiCall
      dockerfile: ./cmd/aws_lambda/cardInfoInsert/Dockerfile
    container_name: ocg_cardapicall_infoinsert
    ports:
      - "9002:8080"
    environment:
      PG_DB_USER: postgres
      PG_DB_PASSWORD: postgres
      PG_DB_HOST_PORT: ocg_db_local:5432
      PG_DB_NAME: postgres
    entrypoint: /usr/local/bin/aws-lambda-rie
    command: ./main
    restart: unless-stopped
    networks:
      - ocg-network
  cardapicall_syncstorageimage:
    build:
      context: ./code/cardApiCall
      dockerfile: ./cmd/aws_lambda/syncStorageImageWithDB/Dockerfile
    container_name: ocg_cardapicall_syncstorageimage
    ports:
      - "9003:8080"
    environment:
      PG_DB_USER: postgres
      PG_DB_PASSWORD: postgres
      PG_DB_HOST_PORT: ocg_db_local:5432
      PG_DB_NAME: postgres
    entrypoint: /usr/local/bin/aws-lambda-rie
    command: ./main
    restart: unless-stopped
    networks:
      - ocg-network
  ocg_db_local:
    image: postgres:16.7-bookworm
    container_name: 'ocg-db-local'
    ports:
      - '5555:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./database/localsetup:/docker-entrypoint-initdb.d
      - postgres_volume_ocg:/var/lib/postgresql/data
    command: -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    networks:
      - ocg-network
volumes:
  postgres_volume_ocg:

networks:
  ocg-network:
    driver: bridge